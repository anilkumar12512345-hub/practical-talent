<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRACTICAL TALENT - OTP Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10111b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #1c1e2d;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0005;
    }

    h1 { font-size: 25px; text-align: center; }
    p { color: #b9bdd0; text-align: center; }

    .phone-row {
      display: flex;
      gap: 8px;
      margin: 20px 0 12px;
    }

    select, input, button {
      font-size: 16px;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #41445b;
    }

    select, input {
      background: #111320;
      color: white;
    }

    select { width: 115px; }
    input { width: 100%; }

    button {
      width: 100%;
      background: #7657ff;
      color: white;
      border: 0;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #otpSection { display: none; margin-top: 20px; }
    #status { font-size: 14px; overflow-wrap: anywhere; }
    #recaptcha-container { margin-top: 15px; }
  </style>
</head>

<body>
  <main class="card">
    <h1>🎬 PRACTICAL TALENT</h1>
    <p>Login with your phone number</p>

    <label for="country">Country code</label>
    <div class="phone-row">
      <select id="country">
        <option value="+91" selected>🇮🇳 India +91</option>
        <option value="+1">🇺🇸 USA +1</option>
        <option value="+44">🇬🇧 UK +44</option>
        <option value="+971">🇦🇪 UAE +971</option>
        <option value="+61">🇦🇺 Australia +61</option>
        <option value="+94">🇱🇰 Sri Lanka +94</option>
        <option value="+977">🇳🇵 Nepal +977</option>
      </select>

      <input id="phone" type="tel" inputmode="numeric"
             placeholder="Phone number" autocomplete="tel-national">
    </div>

    <button id="sendBtn" type="button">Send OTP</button>

    <div id="recaptcha-container"></div>

    <section id="otpSection">
      <label for="otp">Enter OTP</label>
      <input id="otp" type="text" inputmode="numeric"
             autocomplete="one-time-code" placeholder="6-digit OTP">
      <button id="verifyBtn" type="button">Verify OTP</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbx7CLjB0mEuZRE-h9NjM8hvoeoyjX14",
      authDomain: "practical-talent.firebaseapp.com",
      projectId: "practical-talent",
      storageBucket: "practical-talent.firebasestorage.app",
      messagingSenderId: "203171940354",
      appId: "1:203171940354:web:11e1f95f3705298b18bf1b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.languageCode = "en";

    const status = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");
    let confirmationResult = null;
    let verifier = null;
    let sending = false;

    function showError(error) {
      const messages = {
        "auth/invalid-phone-number": "Check the country code and phone number.",
        "auth/too-many-requests": "Too many attempts. Please wait before trying again.",
        "auth/quota-exceeded": "SMS quota reached. Try again after the quota resets.",
        "auth/captcha-check-failed": "CAPTCHA failed. Reload and try again.",
        "auth/unauthorized-domain": "Add this website domain in Firebase Authentication settings.",
        "auth/operation-not-allowed": "Enable Phone sign-in in Firebase Authentication."
      };

      status.textContent = messages[error.code] ||
        ("Error: " + error.code + ". " + error.message);
    }

    function setupVerifier() {
      if (verifier) {
        try { verifier.clear(); } catch (_) {}
      }

      verifier = new firebase.auth.RecaptchaVerifier(
        "recaptcha-container",
        { size: "normal" },
        auth
      );

      return verifier.render();
    }

    sendBtn.addEventListener("click", async () => {
      if (sending) return;

      const country = document.getElementById("country").value;
      const rawPhone = document.getElementById("phone").value.trim();
      const digits = rawPhone.replace(/\D/g, "");

      if (!digits || digits.length < 7 || digits.length > 15) {
        status.textContent = "Enter a valid phone number.";
        return;
      }

      const fullPhone = country + digits;
      sending = true;
      sendBtn.disabled = true;
      status.textContent = "Please complete CAPTCHA if it appears...";

      try {
        await setupVerifier();

        status.textContent = "Sending OTP...";
        confirmationResult = await auth.signInWithPhoneNumber(
          fullPhone,
          verifier
        );

        document.getElementById("otpSection").style.display = "block";
        status.textContent = "OTP sent. Check your SMS.";
      } catch (error) {
        showError(error);

        // A failed attempt may require a fresh CAPTCHA.
        try { await setupVerifier(); } catch (_) {}
      } finally {
        sending = false;
        sendBtn.disabled = false;
      }
    });

    document.getElementById("verifyBtn").addEventListener("click", async () => {
      const code = document.getElementById("otp").value.trim();

      if (!confirmationResult) {
        status.textContent = "First request an OTP.";
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        status.textContent = "Enter the 6-digit OTP.";
        return;
      }

      try {
        const result = await confirmationResult.confirm(code);
        status.textContent = "Login successful!";
        console.log("Signed-in Firebase user UID:", result.user.uid);
      } catch (error) {
        showError(error);
      }
    });
  </script>
</body>
</html>
